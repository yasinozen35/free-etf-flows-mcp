# Smithery Configuration File for Free Spot ETF Flows MCP Server
startCommand:
  type: stdio
  config:
    command: uv
    args:
      - --directory
      - .
      - run
      - python
      - mcp_server.py
  environmentSchema:
    type: object
    properties:
      ETF_FLOWS_API_KEY:
        type: string
        description: Your Pro API Key for unrestricted real-time ETF flow queries.
