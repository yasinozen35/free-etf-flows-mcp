# Smithery configuration. A no-install remote endpoint is also available: https://yasinozen.com/etf-flows/mcp
startCommand:
  type: stdio
  config:
    command: uv
    args:
      - --directory
      - .
      - run
      - python
      - mcp_server.py
  environmentSchema:
    type: object
    properties:
      ETF_FLOWS_API_KEY:
        type: string
        description: Optional free or Pro API key (https://yasinozen.com/etf-flows/get-api-key/).
