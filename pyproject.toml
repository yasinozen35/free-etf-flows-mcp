[project]
name = "free-etf-flows-mcp"
version = "1.1.0"
description = "MCP server for daily US spot Bitcoin & Ethereum ETF net flows (IBIT, FBTC, GBTC, ETHA...)."
readme = "README.md"
authors = [
    { name = "Yasin Özen", email = "yasinozen35@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://yasinozen.com/etf-flows/"
Documentation = "https://yasinozen.com/etf-flows/mcp-server/"
Repository = "https://github.com/yasinozen35/free-etf-flows-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
