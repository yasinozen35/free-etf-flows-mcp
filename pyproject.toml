[project]
name = "free-etf-flows-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for querying Spot Bitcoin & Ethereum ETF flows."
readme = "README.md"
authors = [
    { name = "Yasin Özen", email = "yasinozen35@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
